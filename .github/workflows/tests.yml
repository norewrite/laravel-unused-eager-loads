name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '^10.0'
            testbench: '^8.0'

          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'

          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'

          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Select Laravel and Testbench versions
        run: |
          composer require --dev \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-update \
            --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Show versions
        run: |
          php -v
          composer --version
          php -m | grep -Ei 'PDO|sqlite'
          composer show laravel/framework orchestra/testbench phpunit/phpunit

      - name: Run tests
        run: composer test